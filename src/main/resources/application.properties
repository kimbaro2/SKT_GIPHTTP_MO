spring.application.name=SKT_GIPHTTP_MO
# Spring Boot 기본 서버 비활성화 (DualPortConfig에서 직접 관리)
server.port=-1
# HTTPS 포트는 --server.port 파라미터로 필수 입력 (예: --server.port=7500)
# HTTP 포트는 자동으로 server.port + 44로 계산됨 (예: 7500 -> 7544)
# HTTPS 설정
server.ssl.enabled=false
server.ssl.key-store=classpath:ssl/keystore.p12
server.ssl.key-store-password=changeit
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=skt-giphttp-mo
server.http2.enabled=true
#ThreadPool Setting true==ok
witcom.performance.loop=false
witcom.performance.cacheLoop=true
witcom.performance.per=1
witcom.performance.cLibFileName=JNALibrary.so
witcom.performance.cLibraryFilePath=/APP/sms/src_temp/LIB/JNALibrary.so
witcom.performance.prometheus-url=http://localhost:8080/metrics
witcom.performance.cLibPath=/APP/sms/src_temp/LIB
witcom.performance.valid-mobile-prefixes=010,011,016,017,018,019,012
witcom.performance.moduleName=GIPHTTP
witcom.performance.pFilePath=./logs/
witcom.performance.cFilePath=./logs/
#==================================================================================================#
# MO 도메인 분기 설정 (ESMCLASS 기반)
witcom.mo.domain.noti-plus=20,21
witcom.mo.domain.roaming=36,37,38,40,41,42,69,70,72,73
witcom.mo.domain.normal=1
