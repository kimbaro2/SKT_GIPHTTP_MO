spring.datasource.altibase.jpa.driver-class-name=Altibase.jdbc.driver.AltibaseDriver
spring.datasource.altibase.jpa.url=jdbc:Altibase://121.124.125.227:20301/sms?encoding=UTF-16&autocommit=true&socketTimeout=30000&connectionTimeout=30000
spring.datasource.altibase.jpa.username=sms
spring.datasource.altibase.jpa.password=sms97
spring.datasource.altibase.jpa.encoding=UTF-16
# 기존 커넥션 풀 설정 (HikariCP 사용 시 무시됨)
spring.datasource.altibase.jpa.max-active=150
spring.datasource.altibase.jpa.max-idle=50
spring.datasource.altibase.jpa.min-idle=10
spring.datasource.altibase.jpa.max-wait=-1
spring.datasource.altibase.jpa.initial-size=10
spring.datasource.altibase.jpa.test-on-borrow=true
spring.datasource.altibase.jpa.test-while-idle=true
spring.datasource.altibase.jpa.validation-query=SELECT 1
spring.datasource.altibase.jpa.time-between-eviction-runs-millis=3000
spring.datasource.altibase.jpa.min-evictable-idle-time-millis=7200000
# HikariCP 설정 (소켓 고갈 방지 최적화)
spring.datasource.altibase.jpa.hikari.maximum-pool-size=30
spring.datasource.altibase.jpa.hikari.minimum-idle=5
spring.datasource.altibase.jpa.hikari.connection-timeout=30000
spring.datasource.altibase.jpa.hikari.idle-timeout=600000
spring.datasource.altibase.jpa.hikari.max-lifetime=1800000
spring.datasource.altibase.jpa.hikari.leak-detection-threshold=60000
spring.datasource.altibase.jpa.hikari.connection-test-query=SELECT 1
spring.datasource.altibase.jpa.hikari.validation-timeout=5000
spring.datasource.altibase.jpa.hikari.keepalive-time=300000
